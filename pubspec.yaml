name: bara
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.svg
    - assets/images/star_3.svg
    - assets/images/star_4.svg
    - assets/images/CloudArt_margin_1.svg
    - assets/images/CloudArt_margin_2.svg
    - assets/images/CloudArt_margin.svg
    - assets/images/CloudArt_margin_1.png
    - assets/images/CloudArt_margin_2.png
    - assets/images/CloudArt_margin.png
    - assets/images/group_28.svg
    - assets/images/gmail.svg
    - assets/images/gembok.svg
    - assets/images/mata.svg
    - assets/images/centang.svg 
    - assets/images/tameng.svg
    - assets/images/bara_naik_pesawat.png
    - assets/images/home.svg
    - assets/images/ai_button.png
    - assets/images/bookmark.svg
    - assets/images/buku.svg
    - assets/images/pencil.svg
    - assets/images/logo.png
    - assets/images/hiGavi.png
    - assets/images/userLogo.png
    - assets/images/chatbar.png
    - assets/images/matkul1.png
    - assets/images/matkul2.png
    - assets/images/matkul3.png
    - assets/images/brain.png
    - assets/images/tombol_back.png
    - assets/images/bara_tidur.png
    - assets/images/backgroundDM.png
    - assets/images/logohigavi.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"

  android_12:
    color: "#FFFFFF"
    image: "assets/images/logo.png"
